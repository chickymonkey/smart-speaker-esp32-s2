esphome:
  name: speaker-s2-mini
  friendly_name: speaker-s2-mini
  on_boot:
    priority: -100          # runs after WiFi/network is up
    then:
      - delay: 3s           # give WiFi/API time to settle first
      - media_player.play_media:
          id: speaker_media_player_id
          media_url: "https://github.com/chickymonkey/smart-speaker-esp32-s2/raw/refs/heads/main/sounds_wake_word_triggered.mp3"

esp32:
  variant: ESP32S2
  framework:
    type: esp-idf           # sendspin needs esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none     # important for synchronized audio

#This is the version with 2MB PSRAM
psram:
  mode: quad
  speed: 80MHz

# blink - GPIO15
output:
  - platform: gpio
    pin: 15
    id: led_out
light:
  - platform: binary
    name: "LED"
    output: led_out

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO33
#   i2s_mclk_pin: GPIO35    # only needed if PCM5102's SCK pad is wired (not grounded)

speaker:
  - platform: i2s_audio
    id: speaker_id
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO18
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 800ms  # raise to 1000-1500ms if you get dropouts

sendspin:

media_source:
  - platform: sendspin
    id: sendspin_source
    sample_rate: 48000
    task_stack_in_psram: true
    decode_memory: psram
  - platform: audio_http
    id: http_source_media
    task_stack_in_psram: true

media_player:
  - platform: speaker_source
    name: "Sendspin Speaker"
    id: speaker_media_player_id
    media_pipeline:
      speaker: speaker_id
      num_channels: 2
      sample_rate: 48000
      format: MP3
      sources:
        - sendspin_source
        - http_source_media

# Drive GPIO35 (wired to PCM5102 SCK) low so SCK sees a steady ground
switch:
  - platform: gpio
    pin: GPIO35
    id: sck_ground
    restore_mode: ALWAYS_OFF
    internal: true
