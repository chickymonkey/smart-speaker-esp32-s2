#board info: https://www.espboards.dev/esp32/lolin-s2-mini/
# Audio board: GY-PCM5102 I2S Player Module
# PINs VIN, GND, LRCK, DIN, BCK SCK on PCM aligned to PINs Vbus, GND, 16, 18, 33, 35 on ESP32 S2 and soldered.

esphome:
  name: speaker-s2-mini
  friendly_name: speaker-s2-mini

esp32:
  variant: ESP32S2

logger:

api:


ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


psram:
  mode: quad
  speed: 80MHz

# blink - GPIO1
output:
  - platform: gpio
    pin: 15
    id: led_out
light:
  - platform: binary
    name: "LED"
    output: led_out

  
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO33
#    i2s_mclk_pin: GPIO35   # only needed if PCM5102's SCK pad is wired (not grounded)

speaker:
  - platform: i2s_audio
    id: speaker_id
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO18
    sample_rate: 48000
media_source:
  - platform: audio_http
    id: http_source_media
    
media_player:
  - platform: speaker_source
    name: "Speaker Media Player"
    id: speaker_media_player_id
    media_pipeline:
      speaker: speaker_id
      num_channels: 2
      #used in music assistant.
      sample_rate: 48000
      format: MP3
      sources:
        - http_source_media
